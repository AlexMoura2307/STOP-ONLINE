<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STOP Online</title><style>body{font:16px system-ui;background:#101a30;color:white;max-width:700px;margin:auto;padding:18px}h1,.letter{color:#ffd05a}.letter{font-size:80px;text-align:center}.card{background:#203150;padding:20px;border-radius:18px;margin:15px 0}input{display:block;width:95%;padding:12px;margin:8px 0 15px;background:#101a30;color:white;border:1px solid #7281a1;border-radius:9px;font-size:16px}button{background:#ffd05a;color:#101a30;padding:13px;border:0;border-radius:10px;font-weight:bold;font-size:16px;margin:5px}button:disabled{opacity:.35}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #52617a;text-align:left}</style><h1>🛑 STOP Online</h1><p>2 a 10 jogadores humanos</p><p id="error"></p><section id="entry" class="card"><h2>Entrar ou criar sala</h2>Seu nome<input id="name" placeholder="Seu nome">Código da sala (vazio para criar)<input id="code" placeholder="Código"><button onclick="join()">Entrar / Criar</button></section><section id="game" class="hidden"><div class="card"><h2>Sala <span id="room"></span></h2><button onclick="navigator.clipboard.writeText(location.origin+'/#'+state.code)">Copiar convite</button><p id="players"></p></div><div id="lobby" class="card hidden"><h2>Aguardando jogadores</h2><button id="start" onclick="socket.emit('start')">Iniciar</button></div><div id="draw" class="card hidden"><h2>Sorteio da letra</h2><div class="letter">?</div><p id="turn"></p><button id="drawBtn" onclick="socket.emit('draw')">🎲 SORTEAR</button></div><div id="countdown" class="card hidden"><h2>Prepare-se!</h2><div id="letterCount" class="letter"></div><div id="timer" class="letter">10</div></div><div id="playing" class="card hidden"><h2>Letra <span id="letter"></span></h2><div id="fields"></div><button id="stopBtn" disabled onclick="socket.emit('stop',draft)">🛑 STOP!</button></div><div id="results" class="card hidden"><h2>Resultados</h2><div id="tables"></div><h2>Placar geral</h2><div id="scores"></div><button id="next" onclick="socket.emit('next')">Próxima rodada</button></div></section><script src="/socket.io/socket.io.js"></script><script>const socket=io(),cats=['Nome','Animal','Fruta','Cidade','Cor','Objeto'],$=x=>document.getElementById(x);let me='',state=null,draft={};if(location.hash)$('code').value=location.hash.slice(1);function join(){socket.emit('join',{name:$('name').value,code:$('code').value})}socket.on('errorMessage',m=>$('error').textContent=m);socket.on('joined',d=>{me=d.id;$('entry').classList.add('hidden');$('game').classList.remove('hidden');$('room').textContent=d.code;history.replaceState(null,'','#'+d.code)});function save(){draft={};document.querySelectorAll('[data-cat]').forEach(e=>draft[e.dataset.cat]=e.value);socket.emit('save',draft);$('stopBtn').disabled=!cats.every(c=>draft[c]?.trim())}function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}socket.on('state',s=>{const old=state;state=s;for(const p of ['lobby','draw','countdown','playing','results'])$(p).classList.toggle('hidden',p!==s.phase);$('players').textContent=s.players.map(p=>p.name).join(' • ');$('start').hidden=s.host!==me;$('drawBtn').disabled=s.turn!==me;$('turn').textContent=s.turn===me?'Sua vez de sortear':'Aguardando '+s.players.find(p=>p.id===s.turn)?.name;$('letterCount').textContent=s.letter;$('letter').textContent=s.letter;if(s.phase==='playing'&&old?.phase!=='playing'){draft={};$('fields').innerHTML=cats.map(c=>'<label>'+c+'<input data-cat="'+c+'" placeholder="Começa com '+s.letter+'"></label>').join('');document.querySelectorAll('[data-cat]').forEach(e=>e.addEventListener('input',save));$('stopBtn').disabled=true}if(s.phase==='results'){$('tables').innerHTML=s.results.map(g=>'<h3>'+esc(g.category)+'</h3><table>'+g.rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.answer||'—')+'</td><td>'+r.points+'</td></tr>').join('')+'</table>').join('');$('scores').innerHTML='<table>'+[...s.players].sort((a,b)=>b.score-a.score).map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.score+'</td></tr>').join('')+'</table>';$('next').hidden=s.host!==me}});setInterval(()=>{if(state?.phase==='countdown')$('timer').textContent=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000))},100);</script></html>
