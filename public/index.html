<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STOP Online</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:radial-gradient(circle at 0 0,#302063 0,transparent 35%),linear-gradient(135deg,#080f26,#101b37)!important;max-width:1100px!important;min-height:100vh}h1{font-size:clamp(36px,7vw,65px);letter-spacing:-2px;text-shadow:0 4px 25px #e69b3044}h2{color:#f3f6ff}.card{background:linear-gradient(145deg,#172644,#0e1932)!important;border:1px solid #34476e;box-shadow:0 15px 40px #0004;border-radius:22px!important}button{background:linear-gradient(120deg,#2888ff,#a735e8)!important;color:white!important;cursor:pointer;box-shadow:0 5px 20px #285cff33}button:hover:not(:disabled){filter:brightness(1.15)}input{width:100%!important;background:#0c1730!important;border:1px solid #364e7c!important}input:focus{outline:2px solid #388cff}.letter{font-weight:900;text-shadow:0 0 30px #398bff}#stopBtn{background:linear-gradient(120deg,#ff4263,#d51c46)!important;font-size:22px;width:100%}#start,#drawBtn{width:100%}#error{color:#ff718a}.pill{display:inline-block;padding:8px 12px;border-radius:30px;background:#1c3157;margin:4px}.category-row{display:flex;align-items:center;gap:8px;margin:8px 0}.category-row input{margin:0}.category-row button{flex:none;background:#2b3658!important}.results-scroll{overflow-x:auto}#readyBtn{width:100%;background:linear-gradient(120deg,#00a98b,#2569f2)!important}#readyStatus{color:#5fe9b4;font-weight:700}#fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}#fields label{font-weight:700;color:#8ac8ff}#fields input{margin-top:8px}th{color:#8ac8ff}#scores td:last-child{color:#5fe9b4;font-weight:800}@media(max-width:600px){body{padding:12px!important}.card{padding:15px!important}button{min-height:45px}h1{margin:12px 0}}body{font:16px system-ui;background:#101a30;color:white;max-width:700px;margin:auto;padding:18px}h1,.letter{color:#ffd05a}.letter{font-size:80px;text-align:center}.card{background:#203150;padding:20px;border-radius:18px;margin:15px 0}input{display:block;width:95%;padding:12px;margin:8px 0 15px;background:#101a30;color:white;border:1px solid #7281a1;border-radius:9px;font-size:16px}button{background:#ffd05a;color:#101a30;padding:13px;border:0;border-radius:10px;font-weight:bold;font-size:16px;margin:5px}button:disabled{opacity:.35}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #52617a;text-align:left}</style><h1>🛑 STOP Online</h1><p>2 a 10 jogadores humanos</p><p id="error"></p><section id="entry" class="card"><h2>Entrar ou criar sala</h2>Seu nome<input id="name" placeholder="Seu nome">Código da sala (vazio para criar)<input id="code" placeholder="Código"><button onclick="join()">Entrar / Criar</button></section><section id="game" class="hidden"><div class="card"><h2>Sala <span id="room"></span></h2><button onclick="navigator.clipboard.writeText(location.origin+'/#'+state.code)">Copiar convite</button><p id="players"></p></div><div id="lobby" class="card hidden"><h2>Aguardando jogadores</h2><div id="categoryEditor"><h3>⚙️ Categorias da partida</h3><p>O criador escolhe as categorias para todos.</p><div id="categoryList"></div><input id="newCategory" placeholder="Nova categoria: CEP, Estado, País..."><button onclick="addCategory()">＋ Adicionar categoria</button><button onclick="saveCategories()">💾 Salvar categorias</button></div><button id="start" onclick="socket.emit('start')">Iniciar</button></div><div id="draw" class="card hidden"><h2>Sorteio da letra</h2><div class="letter">?</div><p id="turn"></p><button id="drawBtn" onclick="socket.emit('draw')">🎲 SORTEAR</button></div><div id="countdown" class="card hidden"><h2>Prepare-se!</h2><div id="letterCount" class="letter"></div><div id="timer" class="letter">10</div></div><div id="playing" class="card hidden"><h2>Letra <span id="letter"></span></h2><div id="fields"></div><button id="stopBtn" disabled onclick="socket.emit('stop',draft)">🛑 STOP!</button></div><div id="results" class="card hidden"><h2>Resultados</h2><div id="tables" class="results-scroll"></div><h2>Placar geral</h2><div id="scores"></div><p id="readyStatus"></p><button id="readyBtn" onclick="socket.emit('ready')">✓ OK / PRONTO</button><button id="next" onclick="socket.emit('next')">Próxima rodada</button></div></section><script src="/socket.io/socket.io.js"></script><script>const socket=io(),$=x=>document.getElementById(x);let me='',state=null,draft={},cats=['Nome','Animal','Fruta','Cidade','Cor','Objeto'];if(location.hash)$('code').value=location.hash.slice(1);function join(){socket.emit('join',{name:$('name').value,code:$('code').value})}socket.on('errorMessage',m=>$('error').textContent=m);socket.on('joined',d=>{me=d.id;$('entry').classList.add('hidden');$('game').classList.remove('hidden');$('room').textContent=d.code;history.replaceState(null,'','#'+d.code)});function addCategory(){const v=$('newCategory').value.trim();if(v&&!cats.some(x=>x.toLowerCase()===v.toLowerCase())&&cats.length<12){cats.push(v);$('newCategory').value='';renderCats()}}function renderCats(){$('categoryList').innerHTML=cats.map((x,i)=>'<div class="category-row"><input aria-label="Categoria" value="'+esc(x)+'" onchange="cats['+i+']=this.value.trim()"><button onclick="cats.splice('+i+',1);renderCats()">✕</button></div>').join('')}function saveCategories(){socket.emit('categories',cats.filter(Boolean))}function save(){draft={};document.querySelectorAll('[data-cat]').forEach(e=>draft[e.dataset.cat]=e.value);socket.emit('save',draft);$('stopBtn').disabled=!cats.every(c=>draft[c]?.trim())}function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}socket.on('state',s=>{const old=state;state=s;cats=s.categories||cats;if(s.phase==='lobby'){renderCats();$('categoryEditor').hidden=s.host!==me}for(const p of ['lobby','draw','countdown','playing','results'])$(p).classList.toggle('hidden',p!==s.phase);$('players').textContent=s.players.map(p=>p.name).join(' • ');$('start').hidden=s.host!==me;$('drawBtn').disabled=s.turn!==me;$('turn').textContent=s.turn===me?'Sua vez de sortear':'Aguardando '+s.players.find(p=>p.id===s.turn)?.name;$('letterCount').textContent=s.letter;$('letter').textContent=s.letter;if(s.phase==='playing'&&old?.phase!=='playing'){draft={};$('fields').innerHTML=cats.map(c=>'<label>'+c+'<input data-cat="'+c+'" placeholder="Começa com '+s.letter+'"></label>').join('');document.querySelectorAll('[data-cat]').forEach(e=>e.addEventListener('input',save));$('stopBtn').disabled=true}if(s.phase==='results'){$('tables').innerHTML=s.results.map(g=>'<h3>'+esc(g.category)+'</h3><table>'+g.rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.answer||'—')+'</td><td>'+r.points+'</td></tr>').join('')+'</table>').join('');$('scores').innerHTML='<table>'+[...s.players].sort((a,b)=>b.score-a.score).map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.score+'</td></tr>').join('')+'</table>';$('readyStatus').textContent='Prontos: '+(s.ready||[]).length+' de '+s.players.length;$('readyBtn').disabled=(s.ready||[]).includes(me);$('readyBtn').textContent=$('readyBtn').disabled?'✓ Você está pronto':'✓ OK / PRONTO';$('next').hidden=s.host!==me||s.ready.length!==s.players.length}});setInterval(()=>{if(state?.phase==='countdown')$('timer').textContent=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000))},100);</script></html>
